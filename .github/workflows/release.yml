# Verify a published GitHub Release.
#
# Nothing is built or pushed here. The release assets (tarball, .deb, signed
# .rpm, Proxmox CT template, SBOMs, SHA256SUMS) and the container image are
# produced once by the maintainer's own build and attached to the Release as-is,
# so the bytes users download are the bytes that were tested. This workflow
# re-checks them after publication:
#
#   * every asset matches SHA256SUMS;
#   * the .rpm signature verifies against the published public key;
#   * the .deb is a well-formed Debian package;
#   * the container image, pulled by the digest recorded in image-digest.txt,
#     starts and answers /healthz.
#
# It runs when a Release is published and can be re-run by hand against any tag.

name: Verify release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to verify, for example v0.2.0"
        required: true
        type: string

permissions:
  contents: read
  packages: read

env:
  IMAGE_REPO: ghcr.io/drcoble/timelapse_manager
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  verify:
    name: verify assets and image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Download the release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir assets
          gh release download "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --dir assets
          ls -l assets

      - name: Check SHA256SUMS
        run: |
          set -euo pipefail
          cd assets
          test -f SHA256SUMS
          sha256sum --check SHA256SUMS
          # Every downloaded file other than SHA256SUMS itself must be listed.
          for f in *; do
            [ "${f}" = "SHA256SUMS" ] && continue
            grep -q -E "^[0-9a-f]{64}  \*?${f}$" SHA256SUMS \
              || { echo "ERROR: ${f} is not covered by SHA256SUMS" >&2; exit 1; }
          done

      - name: Verify the .rpm signature
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes rpm
          cd assets
          db="$(mktemp -d)"
          rpm --dbpath "${db}" --import timelapse-manager-rpm-signing-key.asc
          for pkg in timelapse-manager-*.rpm; do
            out="$(rpm --dbpath "${db}" -K "${pkg}")"
            echo "${out}"
            case "${out}" in
              *"signatures OK"*|*"pgp"*"OK"*) ;;
              *) echo "ERROR: ${pkg} did not verify against the published key" >&2; exit 1 ;;
            esac
          done

      - name: Inspect the .deb
        run: |
          set -euo pipefail
          cd assets
          for pkg in timelapse-manager_*.deb; do
            dpkg-deb --info "${pkg}"
            [ "$(dpkg-deb -f "${pkg}" Package)" = "timelapse-manager" ]
          done

      - name: Pull the image by digest and check /healthz
        run: |
          set -euo pipefail
          digest="$(grep -o -E 'sha256:[0-9a-f]{64}' assets/image-digest.txt | head -n 1)"
          [ -n "${digest}" ] || { echo "ERROR: no digest in image-digest.txt" >&2; exit 1; }
          ref="${IMAGE_REPO}@${digest}"
          docker pull "${ref}"
          name="tlm-verify-${GITHUB_RUN_ID}"
          trap 'docker rm -fv "${name}" >/dev/null 2>&1 || true' EXIT
          docker run -d --name "${name}" "${ref}" >/dev/null
          ok=0
          for _ in $(seq 1 60); do
            if docker exec "${name}" curl --fail --silent http://127.0.0.1:8080/healthz; then
              ok=1
              break
            fi
            [ "$(docker inspect -f '{{.State.Running}}' "${name}")" = "true" ] || break
            sleep 2
          done
          echo
          if [ "${ok}" -ne 1 ]; then
            echo "ERROR: /healthz did not answer from ${ref}" >&2
            docker logs --tail 60 "${name}" >&2 || true
            exit 1
          fi
          echo "image ${ref} is healthy"
