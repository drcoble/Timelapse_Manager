<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Access Denied — Timelapse Manager</title>
  {# Standalone page: an error handler renders this after the request session is
     closed, so it carries no app shell (no current_user/nav context to build). #}
  <script src="{{ static_url('js/theme-init.js') }}"></script>
  <link rel="stylesheet" href="{{ static_url('css/app.css') }}">
</head>
<body>
<main class="login-page">
  <div class="login-card">
    <div class="login-header">
      <h1>Access denied</h1>
      <p>You do not have permission to perform this action.</p>
    </div>
    <div class="login-body">
      <div class="login-error" role="alert">
        {{ detail }}
      </div>
      <p><a href="/">Return to the dashboard</a></p>
    </div>
  </div>
</main>
</body>
</html>
